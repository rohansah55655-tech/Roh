<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Road Grid & Speed perspective lines -->
  <path d="M 120 512 L 210 240 L 302 240 L 392 512 Z" fill="#18181b" opacity="0.9" />
  <line x1="256" y1="240" x2="256" y2="512" stroke="#fef08a" stroke-width="8" stroke-dasharray="24 16" />

  <!-- Curbs -->
  <path d="M 100 512 L 120 512 L 210 240 L 195 240 Z" fill="#ef4444" />
  <path d="M 392 512 L 412 512 L 317 240 L 302 240 Z" fill="#ef4444" />

  <!-- Speed lines in sky -->
  <line x1="60" y1="180" x2="180" y2="180" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <line x1="332" y1="160" x2="452" y2="160" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <line x1="80" y1="130" x2="220" y2="130" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- Race Car Top View Vector -->
  <g transform="translate(256, 370)">
    <!-- Shadow -->
    <ellipse cx="0" cy="10" rx="65" ry="105" fill="rgba(0, 0, 0, 0.6)" />

    <!-- Wheels -->
    <rect x="-66" y="-60" width="16" height="42" rx="6" fill="#09090b" />
    <rect x="50" y="-60" width="16" height="42" rx="6" fill="#09090b" />
    <rect x="-66" y="45" width="16" height="44" rx="6" fill="#09090b" />
    <rect x="50" y="45" width="16" height="44" rx="6" fill="#09090b" />

    <!-- Main Aero Body -->
    <path d="M 0 -95 C 32 -95 54 -50 54 40 C 54 85 45 92 0 92 C -45 92 -54 85 -54 40 C -54 -50 -32 -95 0 -95 Z" fill="url(#carGrad)" />

    <!-- Front Splitter & Wings -->
    <rect x="-42" y="-92" width="84" height="10" rx="4" fill="#1e293b" />

    <!-- Windshield Cockpit -->
    <path d="M 0 -45 C 24 -45 32 -20 30 20 C 26 40 18 48 0 48 C -18 48 -26 40 -30 20 C -32 -20 -24 -45 0 -45 Z" fill="#020617" />
    <path d="M -8 -30 L 15 28 L 5 28 Z" fill="rgba(255, 255, 255, 0.25)" />

    <!-- Roof Scoop & Accents -->
    <rect x="-6" y="-15" width="12" height="30" rx="3" fill="#ffffff" opacity="0.9" />

    <!-- Headlights (Glowing Xenon Yellow) -->
    <circle cx="-32" cy="-78" r="7" fill="#fef08a" />
    <circle cx="32" cy="-78" r="7" fill="#fef08a" />

    <!-- Taillights (Glowing LED Red) -->
    <rect x="-42" y="85" width="24" height="6" rx="3" fill="#ef4444" />
    <rect x="18" y="85" width="24" height="6" rx="3" fill="#ef4444" />

    <!-- Rear Carbon Wing -->
    <rect x="-56" y="78" width="112" height="12" rx="4" fill="#0f172a" />
  </g>

  <!-- Turbo Circuit Banner Text / Trophy badge in corner -->
  <g transform="translate(256, 88)">
    <rect x="-140" y="-30" width="280" height="60" rx="30" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="8" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="3" text-anchor="middle">TURBO RACING</text>
  </g>
</svg>
